<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Create account · Oversyte</title>
  <link rel="icon" href="/brand/oversyte-mark.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="signup">
  <main class="auth">
    <section class="auth-hero" aria-label="Oversyte store monitoring">
      <div class="auth-hero-copy">
        <p class="tag">Simple. Local. Secure.</p>
        <h1>Protect your store with confidence.</h1>
        <p class="lead">Create your local account and start reviewing store alerts in one place.</p>
      </div>
    </section>
    <section class="auth-form">
      <form class="auth-card" id="auth-form">
        <img class="logo" src="/brand/oversyte-logo-sm.png" alt="Oversyte">
        <div class="auth-heading">
          <h2>Create your account</h2>
          <p>Enter your details to get started.</p>
        </div>
        <div class="auth-fields">
          <label class="field">
            <span>Full name</span>
            <div class="input-wrap">
              <span class="ico" data-icon="user"></span>
              <input type="text" name="name" autocomplete="name" placeholder="Jane Smith" required autofocus>
            </div>
          </label>
          <label class="field">
            <span>Email address</span>
            <div class="input-wrap">
              <span class="ico" data-icon="mail"></span>
              <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
          </label>
          <label class="field">
            <span>Password</span>
            <div class="input-wrap">
              <span class="ico" data-icon="lock"></span>
              <input type="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
              <button type="button" class="peek" aria-label="Show password" title="Show password"><span class="ico" data-icon="eye"></span></button>
            </div>
          </label>
          <label class="field">
            <span>Confirm password</span>
            <div class="input-wrap">
              <span class="ico" data-icon="lock"></span>
              <input type="password" name="confirm_password" autocomplete="new-password" placeholder="Repeat your password" minlength="8" required>
            </div>
          </label>
        </div>
        <p class="login-err" id="auth-err" role="alert"></p>
        <button class="btn primary block signin" type="submit">Create account <span class="ico" data-icon="chevron"></span></button>
        <p class="auth-switch">Already have an account? <a href="/auth/login">Sign in</a></p>
      </form>
      <p class="auth-legal">© <span id="year"></span> Oversyte</p>
    </section>
  </main>
  <script src="/auth/auth.js"></script>
</body>
</html>
