<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Sign in · Oversyte</title>
  <link rel="icon" href="/brand/oversyte-mark.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
  <main class="auth">
    <section class="auth-hero" aria-label="Oversyte store monitoring">
      <div class="auth-hero-copy">
        <p class="tag">See more. Lose less.</p>
        <h1>Stop theft the moment it happens.</h1>
        <p class="lead">Real-time monitoring and alerts using the cameras already in your store.</p>
      </div>
    </section>
    <section class="auth-form">
      <form class="auth-card" id="auth-form">
        <img class="logo" src="/brand/oversyte-logo-sm.png" alt="Oversyte">
        <div class="auth-heading">
          <h2>Welcome back</h2>
          <p>Sign in to your Oversyte dashboard.</p>
        </div>
        <label class="field">
          <span>Email address</span>
          <div class="input-wrap">
            <span class="ico" data-icon="mail"></span>
            <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required autofocus>
          </div>
        </label>
        <label class="field">
          <span>Password</span>
          <div class="input-wrap">
            <span class="ico" data-icon="lock"></span>
            <input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="peek" aria-label="Show password" title="Show password"><span class="ico" data-icon="eye"></span></button>
          </div>
        </label>
        <p class="login-err" id="auth-err" role="alert"></p>
        <button class="btn primary block signin" type="submit">Sign in <span class="ico" data-icon="chevron"></span></button>
        <p class="auth-switch">New to Oversyte? <a href="/auth/signup">Create an account</a></p>
      </form>
      <p class="auth-legal">© <span id="year"></span> Oversyte</p>
    </section>
  </main>
  <script src="/auth/auth.js"></script>
</body>
</html>
